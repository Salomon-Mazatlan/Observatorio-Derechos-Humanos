<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observatorio de Derechos Humanos</title>
  <meta name="description" content="Mapa interactivo sobre migración, desplazamiento forzado, desaparición forzada y protección a periodistas y personas defensoras en México y Sinaloa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<a class="salto" href="#mapa">Ir al mapa</a>

<header class="barra">
  <h1 class="barra__titulo">Observatorio de Derechos Humanos</h1>

  <div class="barra__grupo" role="group" aria-label="Mapa">
    <span class="barra__etiqueta">Mapa</span>
    <div class="segmentos" id="sel-mapa"></div>
  </div>

  <div class="barra__grupo" role="group" aria-label="Qué ver">
    <span class="barra__etiqueta">Ver</span>
    <div class="segmentos" id="sel-vista">
      <button type="button" data-vista="eventos" aria-pressed="true">Eventos</button>
      <button type="button" data-vista="tematico" aria-pressed="false">Mapa temático</button>
    </div>
  </div>

  <div class="barra__grupo" id="grupo-indicador">
    <label class="barra__etiqueta" for="indicador">Indicador</label>
    <select id="indicador" disabled></select>
    <div class="segmentos" id="sel-forma">
      <button type="button" data-forma="coropleta" aria-pressed="true" disabled>Colores</button>
      <button type="button" data-forma="circulos" aria-pressed="false" disabled>Círculos</button>
    </div>
  </div>

  <div class="barra__grupo" role="group" aria-label="Periodo">
    <span class="barra__etiqueta">Periodo</span>
    <input type="month" id="desde" aria-label="Desde" placeholder="AAAA-MM">
    <span class="barra__etiqueta">a</span>
    <input type="month" id="hasta" aria-label="Hasta" placeholder="AAAA-MM">
    <button type="button" class="barra__boton" id="periodo-todo">Todo</button>
  </div>
</header>

<aside class="panel" id="panel">
  <section class="bloque" id="bloque-temas">
    <h2 class="bloque__titulo">Temas</h2>
    <nav class="temas" id="temas" aria-label="Temas"></nav>
  </section>

  <section class="bloque" id="bloque-filtros">
    <h2 class="bloque__titulo">Filtrar eventos</h2>
    <label class="campo">
      <span>Buscar por lugar o título</span>
      <input type="search" id="buscar" placeholder="Ej. Culiacán, albergue, fosa">
    </label>
    <fieldset class="campo">
      <legend>Nivel de verificación</legend>
      <div class="verif" id="verif"></div>
    </fieldset>
    <p class="conteo" id="conteo" aria-live="polite"></p>
  </section>

  <section class="bloque" id="bloque-tematico" hidden>
    <h2 class="bloque__titulo" id="tematico-titulo"></h2>
    <p class="nota" id="tematico-nota"></p>
    <div class="leyenda" id="leyenda"></div>
    <label class="campo campo--inline"><input type="checkbox" id="eventos-encima"> Mostrar eventos encima</label>
    <p class="nota" id="tematico-metodo"></p>
  </section>

  <section class="bloque bloque--detalle" id="detalle" hidden>
    <h2 class="bloque__titulo">Detalle</h2>
    <div id="detalle-cuerpo"></div>
  </section>

  <section class="bloque">
    <details>
      <summary class="bloque__titulo bloque__titulo--summary">Fuentes de datos</summary>
      <ul class="fuentes" id="fuentes"></ul>
    </details>
  </section>

  <footer class="panel__pie">
    <p>Los registros marcados como <em>ejemplo</em> son plantillas y no describen hechos reales.</p>
    <p><a href="docs/indicadores.md">Ficha de indicadores</a> · <a href="README.md">Cómo colaborar</a></p>
  </footer>
</aside>

<main class="mapa" id="mapa" role="region" aria-label="Mapa interactivo"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
